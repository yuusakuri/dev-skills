name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # The curation's only failure mode is upstream drift, so check weekly.
    - cron: "0 6 * * 1"

jobs:
  catalog:
    name: Curated refs resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every curated skill exists at its pinned ref
        run: python3 scripts/verify-catalog.py
      - name: Verify pins are immutable commits
        run: ./scripts/check-upstream.sh

  router:
    name: Router covers the catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill spec conformance and router coverage
        run: python3 scripts/validate-skills.py
